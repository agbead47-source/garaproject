<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 · To-do Trade</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-logo">To-do Trade</div>
    <p class="login-desc">개발요청서 분석·변환 도구</p>

    <form method="post" action="{{ url_for('login') }}">
      <div class="field">
        <label class="field-label" for="user_id">아이디</label>
        <input class="input" type="text" name="user_id" id="user_id"
               placeholder="hong.gildong" autocomplete="off" autofocus>
      </div>

      <div class="field">
        <label class="field-label" for="password">비밀번호</label>
        <input class="input" type="password" name="password" id="password"
               placeholder="••••••••" autocomplete="off">
      </div>

      <button type="submit" class="btn btn-primary login-btn">로그인</button>
    </form>

    <p class="login-hint">가안 화면입니다. 아무 값이나 입력해도 로그인됩니다.</p>
  </main>
</body>
</html>
