<!-- To-do Trade - 회사 직인 (UI 가안용 도장 이미지)
     실제 운영에서는 스캔한 법인 직인 파일로 교체한다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160"
     role="img" aria-label="주식회사 투두트레이드 대표이사 직인">
  <g transform="rotate(-7 80 80)" fill="none" stroke="#C0392B" opacity="0.88">
    <circle cx="80" cy="80" r="74" stroke-width="5"/>
    <circle cx="80" cy="80" r="64" stroke-width="2"/>
  </g>
  <g transform="rotate(-7 80 80)" fill="#C0392B" opacity="0.88"
     font-family="'Pretendard', 'Malgun Gothic', sans-serif" text-anchor="middle">
    <text x="80" y="60" font-size="15" font-weight="700" letter-spacing="2">주식회사</text>
    <text x="80" y="90" font-size="20" font-weight="800" letter-spacing="-.5">투두트레이드</text>
    <text x="80" y="115" font-size="14" font-weight="700" letter-spacing="2">대표이사印</text>
  </g>
</svg>
